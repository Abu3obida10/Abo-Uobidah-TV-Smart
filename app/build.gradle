plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Resolve the persistent owner key once. A missing release key must NOT prevent
// assembleDebug/testDebugUnitTest; it must block only release packaging tasks.
def signingFile = System.getenv('ABO_UOBIDAH_SIGNING_PROPERTIES')
if (signingFile == null || signingFile.trim().isEmpty()) {
    signingFile = new File(System.getProperty('user.home'), '.abo-uobidah/signing.properties').absolutePath
}
def signingProps = new Properties()
def signingPropsFile = file(signingFile)
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def releaseStore = System.getenv('ANDROID_KEYSTORE_FILE') ?: signingProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: signingProps.getProperty('storePassword')
def releaseAlias = System.getenv('ANDROID_KEY_ALIAS') ?: signingProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: signingProps.getProperty('keyPassword')
def releaseSigningReady = !!(releaseStore && releaseStorePassword && releaseAlias && releaseKeyPassword)
ext.releaseSigningReady = releaseSigningReady

android {
    namespace 'com.uobidah.launcher'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.uobidah.launcher"
        minSdk 26
        // 33 على قصد: يتجنب قيود أنواع الخدمات الأمامية الصارمة في 34 على شاشات Android TV
        targetSdk 33
        versionCode providers.gradleProperty("appVersionCode").get().toInteger()
        versionName providers.gradleProperty("appVersionName").get()
    }

    signingConfigs {
        release {
            // Do not invent or silently substitute a new key. Configure fields only
            // when the owner's existing keystore credentials are actually present.
            if (releaseSigningReady) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Missing signing leaves this build type intentionally unassigned.
            // The release-specific task guard below prevents an unsigned artifact.
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = false
        unitTests.includeAndroidResources = true
    }


    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// These hooks are attached at Project scope and run only on release packaging paths,
// never on assembleDebug or testDebugUnitTest.
tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'validateSigningRelease', 'packageRelease', 'packageReleaseBundle', 'bundleRelease']) {
        task.doFirst {
            if (!project.ext.releaseSigningReady) {
                throw new GradleException('Release signing is not configured. Configure the persistent owner keystore via ABO_UOBIDAH_SIGNING_PROPERTIES or ~/.abo-uobidah/signing.properties. Debug builds and unit tests do not require the release key.')
            }
        }
    }
}

// Make failed Android unit tests actionable in local logs and CI artifacts.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

configurations { robolectricAndroidAll }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'

    // android-all jars resolved through Gradle's downloader (retries/backoff) instead of
    // Robolectric's plain-URL fetcher, which Maven Central throttled with HTTP 429 repeatedly.
    robolectricAndroidAll 'org.robolectric:android-all-instrumented:14-robolectric-10818077-i7'
    robolectricAndroidAll 'org.robolectric:android-all-instrumented:13-robolectric-9030017-i7'
}

def copyRobolectricAndroidAll = tasks.register('copyRobolectricAndroidAll', Copy) {
    from(configurations.robolectricAndroidAll)
    into(layout.buildDirectory.dir('robolectric-deps'))
    include('android-all-instrumented-*.jar')
}

tasks.withType(Test).configureEach {
    dependsOn(copyRobolectricAndroidAll)
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir',
            layout.buildDirectory.dir('robolectric-deps').get().asFile.absolutePath
}
