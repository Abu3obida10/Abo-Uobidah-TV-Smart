org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process

# Work around older HTTPS inspection gateways that abort TLS 1.3 handshakes.
# TLS 1.2 remains enabled with normal certificate/hostname verification.
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2

# Single source of truth for the Android app release identity.
appVersionName=1.0.54
appVersionCode=75
